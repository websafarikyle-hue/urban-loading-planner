name: Scenario audit
on:
  push:
    branches: [main, 'fix/**', test/scenario-audit-cloud]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Fetch reviewed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scenario and route audit
        env:
          SCENARIO_SHARD: ${{ matrix.shard }}
        run: node tests/scenario-audit-cloud.cjs
      - name: Shared solver and product regression
        if: matrix.shard == 0
        run: |
          node --check frontend/app.js
          node --check frontend/v03/app.js
          node tests/v03-engine.cjs
          node tests/v09-product.cjs
          node tests/v03-ui.mjs
          node tests/v091-analysis.cjs
          node tests/dispatch-audit.cjs
          node tests/performance-service.cjs
          python -m unittest discover -s tests -v
          node tests/ui-smoke.mjs
      - name: Generated assets and real browser regression
        if: matrix.shard == 0
        run: |
          python scripts/build_standalone.py
          python scripts/prepare_github_pages.py
          git diff --exit-code -- index.html app.js engine.js product.js worker.js standalone-demo.html
          node tests/v09-browser.cjs
